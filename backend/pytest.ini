[pytest]
testpaths = tests
pythonpath = .
markers =
    concorrencia: grava de verdade com conexões e threads separadas (CT-62 a CT-64); rodar só eles: pytest -m concorrencia
filterwarnings =
    # Aviso interno do slowapi 0.1.10 (usa asyncio.iscoroutinefunction); não vem do nosso código
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi.*
