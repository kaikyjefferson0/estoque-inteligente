[pytest]
testpaths = tests
pythonpath = .
markers =
    unitario: sem banco (todo teste de tests/unit, marcado pelo conftest); rodar só eles: pytest -m unitario
    integracao: usa o banco _test (todo teste com as fixtures engine ou db, marcado pelo conftest); rodar só eles: pytest -m integracao
    concorrencia: grava de verdade com conexões e threads separadas (CT-62 a CT-64; corridas da exclusão de fornecedor: CT-24, CT-86 e CT-87); rodar só eles: pytest -m concorrencia
filterwarnings =
    # Aviso interno do slowapi 0.1.10 (usa asyncio.iscoroutinefunction); não vem do nosso código
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi.*
