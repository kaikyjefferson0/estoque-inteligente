# Blueprint do Render: banco, API e site. Passo a passo em docs\deploy.md.
# Nenhum segredo neste arquivo: a URL do banco vem do próprio banco, a SECRET_KEY é gerada
# pelo Render e as contas e os endereços públicos (sync: false) são preenchidos no painel na
# criação do Blueprint. Um sync: false nunca é sobrescrito por uma sincronização do Blueprint.

databases:
  - name: estoque-db
    plan: free
    region: virginia
    databaseName: estoque_inteligente
    user: estoque
    # Lista vazia: só os serviços do Render (rede privada) acessam o banco, nada da internet
    ipAllowList: []

services:
  - type: web
    name: estoque-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # As migrations rodam antes de a API subir; 1 processo, porque os limites de tentativas
    # (RN-47, RN-52 e RN-56) ficam na memória do processo
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      # O Render entrega postgresql://; o config.py troca para postgresql+psycopg://
      - key: DATABASE_URL
        fromDatabase:
          name: estoque-db
          property: connectionString
      # RN-54: a recriação da demo exige a URL do dono escrita de propósito. Aqui há um
      # usuário só (sem APP_DB_ROLE), então é a mesma URL da DATABASE_URL.
      - key: MIGRATIONS_DATABASE_URL
        fromDatabase:
          name: estoque-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: DEMO_MODE
        value: "true"
      # Endereço público do site, preenchido no painel (ex.: https://estoque-site-4qap.onrender.com).
      # Não sai do nome do serviço: quando o nome já é de outra conta, o Render acrescenta um
      # sufixo (-4qap), e um valor escrito aqui pelo nome liberaria o site de outra pessoa.
      # O fromService também não serve: devolve o nome interno, que o navegador não alcança.
      - key: CORS_ORIGINS
        sync: false
      # Preenchidas no painel (nunca no git)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_EMAIL
        sync: false
      - key: DEMO_PASSWORD
        sync: false

  # Static site: sem plan e sem region (é sempre gratuito e servido por uma CDN global)
  - type: web
    name: estoque-site
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Rotas do React (/produtos, /estoque...) abrem o index.html; arquivos que existem vêm direto
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Os mesmos cabeçalhos de segurança da API (app\main.py), com o HSTS de produção
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      # Lidas no build (npm run build): mudar qualquer uma exige um novo deploy do site.
      # Endereço público da API, preenchido no painel (ex.: https://estoque-api-pqbo.onrender.com).
      # Não sai do nome do serviço: com o sufixo que o Render acrescenta quando o nome já é de
      # outra conta, um valor escrito aqui pelo nome mandaria o login para a API de outra pessoa.
      - key: VITE_API_URL
        sync: false
      - key: VITE_DEMO
        value: "true"
      # RN-53: conta pública do botão "Entrar como demonstração"; iguais a DEMO_EMAIL e
      # DEMO_PASSWORD da API. Sem elas, o botão não aparece.
      - key: VITE_DEMO_EMAIL
        sync: false
      - key: VITE_DEMO_SENHA
        sync: false
