<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Folhinha (identidade Folhinha): papel com a faixa de tinta no topo, como a folha do dia do login,
    e os dias da semana; o de hoje vai em placa preta, o único uso da placa além do botão principal.
    O papel branco aparece em aba escura e o contorno de tinta, em aba clara.
    SVG avulso não lê o theme.css, por isso as cores estão escritas; cada uma é cópia de um token
    do theme.css (os nomes vão sem os dois hífens do começo, que o XML não aceita em comentário):
    #ffffff = cor-superficie (papel)
    #121212 = cor-faixa (faixa do topo), cor-texto (contorno) e a placa de hoje
    #8a8a84 = cor-borda-forte (os outros dias)
  -->
  <rect x="4" y="4" width="24" height="24" rx="2" fill="#ffffff" stroke="#121212" stroke-width="2"/>
  <path d="M6 4h20a2 2 0 0 1 2 2v5H4V6a2 2 0 0 1 2-2z" fill="#121212"/>
  <rect x="8" y="14" width="4" height="4" fill="#8a8a84"/>
  <rect x="14" y="14" width="4" height="4" fill="#8a8a84"/>
  <rect x="20" y="14" width="4" height="4" fill="#8a8a84"/>
  <rect x="8" y="20" width="4" height="4" fill="#8a8a84"/>
  <rect x="14" y="20" width="4" height="4" fill="#121212"/>
  <rect x="20" y="20" width="4" height="4" fill="#8a8a84"/>
</svg>
